{% extends 'base.html' %}

{% block title %}KnitBlog | Get Started{% endblock %}

{% block extra_head %}
<style>
  .knit-auth-page{
    min-height:calc(100vh - 260px);display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
  }
  .knit-auth-card{
    width:100%;max-width:500px;background:#fff;border-radius:26px;
    padding:54px 46px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.10);
  }
  .knit-auth-card h1{margin:0 0 14px;color:var(--knit-primary);font-size:34px;font-weight:800;letter-spacing:-.8px;}
  .knit-auth-card p{margin:0 auto 32px;max-width:380px;color:#555;font-size:16px;line-height:1.65;}
  .knit-auth-button{
    display:block;width:100%;padding:14px 20px;border-radius:11px;
    text-decoration:none;font-size:16.5px;font-weight:600;text-align:center;
    transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease;
  }
  .knit-auth-signup{background:var(--knit-primary);color:#fff;}
  .knit-auth-signup:hover{background:var(--knit-primary-dark);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.15);}
  .knit-auth-login{background:#fff;color:var(--knit-primary);border:2px solid var(--knit-primary);}
  .knit-auth-login:hover{background:var(--knit-primary);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.15);}
  .knit-auth-or{display:flex;align-items:center;gap:15px;margin:22px 0;}
  .knit-auth-or::before,.knit-auth-or::after{content:"";flex:1;height:1px;background:#ddd;}
  .knit-auth-or span{color:#888;font-size:13px;font-weight:600;}
</style>
{% endblock %}

{% block body %}
<div class="knit-auth-page">
  <div class="knit-auth-card">
    <h1>Join KnitBlog</h1>
    <p>Connect with people, share your thoughts, and keep meaningful conversations close.</p>

    <a href="{% url 'signup' %}" class="knit-auth-button knit-auth-signup">Create an Account</a>

    <div class="knit-auth-or"><span>OR</span></div>

    <a href="{% url 'login' %}" class="knit-auth-button knit-auth-login">Sign In</a>
  </div>
</div>
{% endblock %}
